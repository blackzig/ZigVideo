[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zigvideo"
version = "0.1.0"
description = "Hardware-aware local AI video generation for low-resource PCs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "blackzig"}]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = [
  "diffusers==0.40.0",
  "transformers==5.17.0",
  "accelerate>=1.0",
  "huggingface-hub>=1.31,<2.0",
  "safetensors>=0.5",
  "gguf>=0.10",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "tiktoken>=0.7",
  "imageio[ffmpeg]>=2.37"
]

[project.scripts]
zigvideo = "zigvideo.cli:main"

[tool.setuptools.packages.find]
include = ["zigvideo*"]
exclude = ["config*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
